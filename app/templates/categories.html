{% extends 'base.html' %}{% block content %}<div class="page-heading"><div><p class="eyebrow">Organización del archivo</p><h1>Categorías</h1></div></div><section class="panel"><h2>Crear categoría</h2><form method="post" class="search-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Nombre<input name="name" maxlength="100" required></label><button class="button primary">Crear</button></form></section>{% for category in categories %}<section class="panel"><div class="actions"><form class="search-form" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="category_id" value="{{ category.id }}"><label>Nombre<input name="name" value="{{ category.name }}" maxlength="100" required></label><button class="button">Guardar</button></form><form method="post" action="{{ url_for('admin.delete_category',category_id=category.id) }}" data-confirm="¿Eliminar esta categoría?"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="button danger">Eliminar</button></form></div></section>{% endfor %}{% endblock %}
