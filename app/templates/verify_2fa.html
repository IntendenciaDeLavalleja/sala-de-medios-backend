{% extends 'base.html' %}{% block main_class %}auth-shell{% endblock %}{% block content %}<section class="auth-card"><p class="eyebrow">Segundo factor</p><h1>Revisá tu correo.</h1><p class="muted">Enviamos un código a <strong>{{ email }}</strong>. Vence en {{ config.TWO_FACTOR_TTL_MINUTES }} minutos.</p><form method="post" class="stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Código de seis dígitos<input class="code-input" name="code" type="text" pattern="[0-9]{6}" maxlength="6" inputmode="numeric" autocomplete="one-time-code" required autofocus></label><button class="button primary">Ingresar</button></form><a href="{{ url_for('auth.login') }}" class="text-link">Volver a ingresar / solicitar otro código</a></section>{% endblock %}
