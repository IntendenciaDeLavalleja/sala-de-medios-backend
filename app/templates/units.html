{% extends 'base.html' %}{% block content %}<div class="page-heading"><div><p class="eyebrow">Administración</p><h1>Unidades y cuotas</h1></div></div><section class="panel"><h2>Crear unidad</h2><form method="post" class="form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Nombre<input name="name" maxlength="255" required></label><label>Cuota (GB)<input name="quota_gb" type="number" min="0.1" max="100000" step="0.1" value="20" required></label><div><button class="button primary">Crear unidad</button></div></form></section>{% for unit,used in units %}<section class="panel"><h2>{{ unit.name }}</h2><p class="muted">Utilizado: {{ used|filesize }}</p><form method="post" class="form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="unit_id" value="{{ unit.id }}"><label>Nombre<input name="name" maxlength="255" value="{{ unit.name }}" required></label><label>Cuota (GB)<input name="quota_gb" type="number" min="0.1" max="100000" step="0.1" value="{{ unit.quota_bytes / 1024**3 }}" required></label><div><button class="button">Guardar</button></div></form></section>{% endfor %}{% endblock %}
