{% extends 'base.html' %}{% block content %}<div class="page-heading"><div><p class="eyebrow">Tu cuenta</p><h1>Mi perfil</h1><p class="muted">{{ current_user.role }}{% if current_user.unit %} · {{ current_user.unit.name }}{% endif %}</p></div></div><section class="panel narrow"><form class="stack" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Nombre<input name="username" value="{{ current_user.username }}" minlength="3" maxlength="64" required></label><label>Correo<input name="email" type="email" value="{{ current_user.email }}" maxlength="255" required></label><label>Contraseña actual<input name="current_password" type="password" autocomplete="current-password" required></label><label>Nueva contraseña (opcional)<input name="password" type="password" minlength="12" maxlength="256" autocomplete="new-password"></label><p class="muted small">Al guardar deberás volver a ingresar con segundo factor.</p><button class="button primary">Guardar perfil</button></form></section>{% endblock %}
