<nav class="pagination" aria-label="Páginas">{% if pagination.has_prev %}<a class="button" href="{{ url_for(request.endpoint,page=pagination.prev_num,q=request.args.get('q','')) }}">← Anterior</a>{% endif %}<span>Página {{ pagination.page }} de {{ pagination.pages or 1 }}</span>{% if pagination.has_next %}<a class="button" href="{{ url_for(request.endpoint,page=pagination.next_num,q=request.args.get('q','')) }}">Siguiente →</a>{% endif %}</nav>
